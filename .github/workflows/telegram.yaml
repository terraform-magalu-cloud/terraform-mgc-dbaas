name: Telegram Notification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v1.0.0 ou vazio para a última)'
        required: false
        default: 'latest'
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    name: Send Telegram Message
    if: >
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Release Info
        id: prep
        run: |
          python3 -c '
          import os, json, urllib.request, html

          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          tag_input = os.environ.get("INPUT_TAG", "").strip()

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event_data = {}
          if event_path and os.path.exists(event_path):
              with open(event_path) as f:
                  event_data = json.load(f)

          release = event_data.get("release")

          # Se for disparo manual (sem release no evento), consulta a API do GitHub
          if not release and repo:
              api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              if tag_input and tag_input != "latest":
                  url = f"{api_base}/repos/{repo}/releases/tags/{tag_input}"
              else:
                  url = f"{api_base}/repos/{repo}/releases/latest"

              req = urllib.request.Request(url)
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "GitHubActions-Telegram")
              try:
                  with urllib.request.urlopen(req) as resp:
                      release = json.loads(resp.read().decode())
              except Exception as e:
                  print(f"Warning: could not fetch release from API: {e}")

          if release:
              tag = release.get("tag_name") or tag_input or "v1.0.0"
              html_url = release.get("html_url") or f"https://github.com/{repo}/releases/tag/{tag}"
              author_info = release.get("author") or {}
              author_name = author_info.get("login") or os.environ.get("GITHUB_ACTOR", "github-actions")
              author_url = author_info.get("html_url") or f"https://github.com/{author_name}"
              raw_body = (release.get("body") or "").strip()
          else:
              tag = tag_input or "v1.0.0"
              html_url = f"https://github.com/{repo}/releases"
              author_name = os.environ.get("GITHUB_ACTOR", "github-actions")
              author_url = f"https://github.com/{author_name}"
              raw_body = "Nenhuma nota encontrada."

          escaped = html.escape(raw_body) if raw_body else "Sem notas de release informadas."
          if len(escaped) > 1500:
              escaped = escaped[:1500].rsplit("\n", 1)[0] + "\n\n<i>... e mais no link abaixo.</i>"

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a") as f:
                  f.write(f"tag={tag}\n")
                  f.write(f"html_url={html_url}\n")
                  f.write(f"author_name={author_name}\n")
                  f.write(f"author_url={author_url}\n")
                  f.write("notes<<EOF\n" + escaped + "\nEOF\n")
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Notify Telegram
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            🚀 <b>NOVA VERSÃO PUBLICADA!</b>

            📦 <b>Projeto:</b> <code>${{ github.repository }}</code>
            🏷️ <b>Versão:</b> <code>${{ steps.prep.outputs.tag }}</code>
            👤 <b>Autor:</b> <a href="${{ steps.prep.outputs.author_url }}">${{ steps.prep.outputs.author_name }}</a>

            📝 <b>O que há de novo:</b>
            <blockquote>${{ steps.prep.outputs.notes }}</blockquote>

            🔗 <a href="${{ steps.prep.outputs.html_url }}">Visualizar Release completa no GitHub</a>